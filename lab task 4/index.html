<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="todo-container">
    <h1>Todo App</h1>
    
    <div class="input-section">
      <input type="text" id="todoInput" placeholder="What needs doing?">
      <button id="addBtn">Add</button>
    </div>

    <div class="filters-info">
      <span id="tipText">Tip: double-click a todo to edit. Press Enter to save.</span>
      <div class="filter-btns">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
    </div>

    <ul id="todoList"></ul>

    <div class="footer-section">
      <span id="itemsLeft">0 items left</span>
      <div class="action-btns">
        <button id="clearCompletedBtn">Clear completed</button>
        <button id="clearAllBtn">Clear all</button>
      </div>
    </div>
  </div>

  <!-- NOTE: Always link the compiled .js file, not .ts -->
  <script src="script.js"></script>
</body>
</html>

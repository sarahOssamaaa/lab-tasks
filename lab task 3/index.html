<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="calculator">
    <div class="display" id="display">0</div>

    <div class="buttons">
      <!-- Row 1 -->
      <button class="btn btn-top" id="clearBtn" onclick="clearAll()">AC</button>
      <button class="btn btn-top" onclick="toggleSign()">+/-</button>
      <button class="btn btn-top" onclick="percentage()">%</button>
      <button class="btn btn-op" onclick="setOperator('/')">&divide;</button>

      <!-- Row 2 -->
      <button class="btn btn-num" onclick="appendDigit('7')">7</button>
      <button class="btn btn-num" onclick="appendDigit('8')">8</button>
      <button class="btn btn-num" onclick="appendDigit('9')">9</button>
      <button class="btn btn-op" onclick="setOperator('*')">&times;</button>

      <!-- Row 3 -->
      <button class="btn btn-num" onclick="appendDigit('4')">4</button>
      <button class="btn btn-num" onclick="appendDigit('5')">5</button>
      <button class="btn btn-num" onclick="appendDigit('6')">6</button>
      <button class="btn btn-op" onclick="setOperator('-')">-</button>

      <!-- Row 4 -->
      <button class="btn btn-num" onclick="appendDigit('1')">1</button>
      <button class="btn btn-num" onclick="appendDigit('2')">2</button>
      <button class="btn btn-num" onclick="appendDigit('3')">3</button>
      <button class="btn btn-op" onclick="setOperator('+')">+</button>

      <!-- Row 5 -->
      <button class="btn btn-num btn-zero" onclick="appendDigit('0')">0</button>
      <button class="btn btn-num" onclick="appendDecimal()">.</button>
      <button class="btn btn-op" onclick="calculate()">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
